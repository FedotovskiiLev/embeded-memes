name: Fix original hamster colors and transparent backgrounds

on:
  push:
    branches: [main]
    paths:
      - 'scripts/restore_original_palette.py'
      - '.github/workflows/restore-palette.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-hamster-palette
  cancel-in-progress: false

jobs:
  fix-palette:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline catalog build dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore exact original palettes (no generative models)
        run: python scripts/restore_original_palette.py
      - name: Check catalog, linked media and search
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate.py --quick
          node --test tests/*.test.cjs
          node --check src/app.js
          python -m py_compile scripts/curate_hamsters.py scripts/restore_original_palette.py
      - name: Recalculate all published SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          lines=[]
          for p in sorted(Path('.').rglob('*')):
            if p.is_file() and '.git' not in p.parts and '__pycache__' not in p.parts and p.suffix!='.pyc' and p.name!='SHA256SUMS.txt':
              lines.append(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.as_posix())
          Path('SHA256SUMS.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          sha256sum -c SHA256SUMS.txt >/dev/null
      - name: Commit verified, transparent color-faithful assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No palette changes to commit'
            exit 0
          fi
          git commit -m 'Fix v2.2.1 palette regression: preserve original colors and transparent backgrounds'
          git push origin HEAD:main
